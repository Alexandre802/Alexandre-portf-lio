name: Validar Portfolio

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar arquivos locais
        run: |
          test -s index.html
          test -s portfolio-assets/hero.webp
          test -s portfolio-assets/logo.webp
          test -s portfolio-assets/profile.webp
          test -s assets/michel-showcase.mp4
          test -s vercel.json
          ! grep -R "raw.githubusercontent.com/Alexandre802/teste/main/portfolio-assets" --exclude-dir=.git .
