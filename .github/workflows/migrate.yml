name: Migrar Portfolio

on:
  push:
    branches: [main]
    paths: ['.github/workflows/migrate.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destino
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar fonte dos assets antigos
        run: git clone --depth 1 --branch main https://github.com/Alexandre802/teste.git /tmp/fonte

      - name: Migrar página e assets do portfólio
        run: |
          rm -rf portfolio-assets assets
          curl -fL --retry 3 https://alexandre-solucoes-digitais-d1lz48jr9.vercel.app -o index.html
          cp -R /tmp/fonte/portfolio-assets ./portfolio-assets
          mkdir -p assets
          curl -fL --retry 3 https://alexandre-solucoes-digitais-9wu8839xq.vercel.app/assets/michel-showcase.mp4 -o assets/michel-showcase.mp4
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('https://raw.githubusercontent.com/Alexandre802/teste/main/portfolio-assets/hero.webp','portfolio-assets/hero.webp')
          s=s.replace('https://raw.githubusercontent.com/Alexandre802/teste/main/portfolio-assets/logo.webp','portfolio-assets/logo.webp')
          s=s.replace('https://raw.githubusercontent.com/Alexandre802/teste/main/portfolio-assets/profile.webp','portfolio-assets/profile.webp')
          s=s.replace('https://alexandre-solucoes-digitais-9wu8839xq.vercel.app/assets/michel-showcase.mp4','assets/michel-showcase.mp4')
          p.write_text(s)
          PY
          cat > vercel.json <<'EOF'
          {
            "cleanUrls": true,
            "trailingSlash": false
          }
          EOF
          cat > MIGRACAO.md <<'EOF'
          # Alexandre Soluções Digitais — repositório isolado
          A página, imagens da marca/perfil e vídeo de demonstração são servidos deste próprio repositório/deploy. O portfólio não depende dos assets do antigo monorepositório.
          EOF

      - name: Registrar migração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migra portfólio e assets para repositório próprio" || exit 0
          git push origin main
